<div ui-tree-handle class="tree-node tree-node-content">
	<a ng-class="{'selected': selectedTP != null && selectedTP.id === node.id}"
		data-nodrag ng-click="selectGroup(node)" class="point">{{node.name}}</a> <a
		title="Delete Group" class="point pull-right btn btn-danger btn-xs"
		data-nodrag ng-click="deleteGroup(node.id)"><span class="fa fa-trash"></span></a>
</div>
