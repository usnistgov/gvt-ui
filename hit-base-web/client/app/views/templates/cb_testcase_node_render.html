<div class="tree-node tree-node-content">
	<i ng-if="node.children && node.children.length > 0" data-nodrop-enabled
		ng-click="toggle(this)"><span class="fa"
		ng-class="{
          'fa-caret-right': collapsed,
          'fa-caret-down': !collapsed
        }"></span></i>
	<i data-nodrag ng-class="get_icon_type(node)"></i> <span data-nodrag
		title="Transport supported" class="label label-danger label-icon"
		ng-show="node.type === 'TestPlan' && node.transport === true">T</span> <span
		ng-if="node.edit"> <input id="nodeName" required name="name"
		data-nodrag ng-model="node.editName" style="width: 50%"> <a
		title="Reset" class="btn btn-warning btn-xs" data-nodrag
		ng-click="resetNodeName(node)" ng-disabled="node.disableEdit"><span
			class="fa fa-times"></span></a> <a title="Save" class="btn btn-primary btn-xs"
		data-nodrag ng-click="saveNodeName(node)" ng-disabled="node.disableEdit"><span
			class="fa fa-check"></span></a>
	</span> <span> <a ng-if="!node.edit" data-nodrag
		ng-click="selectTestNode(node)" class="point">{{node.label}}</a> <a
		ng-show="!node.edit" class="point btn btn-default btn-xs" data-nodrop-enabled
		ng-click="editNodeName(node);"><span class="fa fa-pencil"></span></a>
	</span>
</div>
<ol ui-tree-nodes="" data-nodrop-enabled ng-model="node.children"
	ng-class="{hidden: collapsed}">
	<li ng-repeat="node in node.children" ui-tree-node
		ng-include="'views/templates/cb_testcase_node_render.html'"></li>
</ol>
